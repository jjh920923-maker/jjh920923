<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정재환 ♥ 김예솔 결혼합니다</title>
<meta name="description" content="2027년 4월 3일 토요일 오후 1시 30분, 호텔PJ 1층 뮤즈홀">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#fbf8f1;
    --paper:#f4efe3;
    --ink:#2f3a33;
    --ink-soft:#6b756d;
    --court:#4c8460;
    --court-deep:#3c6d4e;
    --surround:#6f9c78;
    --ball:#d7e65c;
    --ball-deep:#b9c93f;
    --line:#ffffff;
    --rose:#e7a5a0;
    --accent:#3c6d4e;
    --rule:#e2dccd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ivory);color:var(--ink);-webkit-tap-highlight-color:transparent}
  body{font-family:"Noto Sans KR",system-ui,sans-serif;font-weight:400;line-height:1.7;overflow-x:hidden}
  body.locked{overflow:hidden;height:100dvh}

  /* ───────── 인트로: 테니스 코트 ───────── */
  #intro{position:fixed;inset:0;z-index:50;pointer-events:none}
  #intro .half{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--surround);
    transition:transform 1.5s cubic-bezier(.77,0,.18,1);pointer-events:auto}
  #intro .half.top{top:0}
  #intro .half.bot{top:50%}
  #intro.open .half.top{transform:translateY(-101%)}
  #intro.open .half.bot{transform:translateY(101%)}
  #intro .half::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 70% at 50% 100%, rgba(255,255,255,.08), transparent 60%)}
  #intro .half.bot::after{background:radial-gradient(120% 70% at 50% 0%, rgba(255,255,255,.08), transparent 60%)}
  #intro .half.top{box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .court{position:absolute;overflow:visible;display:block}

  .player{position:absolute;will-change:transform;transform-origin:50% 100%}
  .player svg{display:block;width:100%;height:100%;overflow:visible}
  .player .arm{transform-box:view-box}
  .player.bride .arm{transform-origin:62px 76px}
  .player.groom .arm{transform-origin:62px 76px}
  .player.swing .arm{animation:swing .42s cubic-bezier(.3,.7,.3,1)}
  @keyframes swing{0%{transform:rotate(0)}35%{transform:rotate(-58deg)}70%{transform:rotate(22deg)}100%{transform:rotate(0)}}
  .player .bob{animation:bob 1.1s ease-in-out infinite;transform-box:view-box;transform-origin:50px 140px}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

  #ballLayer{position:absolute;inset:0;pointer-events:none;z-index:5}
  #ballShadow{position:absolute;left:0;top:0;border-radius:50%;background:rgba(20,40,25,.35);filter:blur(1px);will-change:transform,opacity}
  #ball{position:absolute;left:0;top:0;will-change:transform}
  #ball svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transition:opacity .35s, transform .5s cubic-bezier(.3,1.6,.5,1)}
  #ball .heart{opacity:0;transform:scale(.3)}
  #ball.is-heart .tball{opacity:0;transform:scale(.3)}
  #ball.is-heart .heart{opacity:1;transform:scale(2.8);animation:beat 1s .5s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(2.8)}40%{transform:scale(3.3)}}
  #intro.open #ball{transition:opacity .9s .4s;opacity:0}

  .callout{position:absolute;left:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;
    font-family:"Cormorant Garamond",serif;font-style:italic;color:#fff;letter-spacing:.06em;
    text-shadow:0 2px 10px rgba(0,0,0,.25);white-space:nowrap;transition:opacity .5s, transform .5s;z-index:6;pointer-events:none}
  .callout.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #intro.open .callout{opacity:0;transition:opacity .4s}

  #skip{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));z-index:10;
    pointer-events:auto;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.12);color:#fff;
    font:500 12px/1 "Noto Sans KR",sans-serif;letter-spacing:.08em;padding:9px 14px;border-radius:999px;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);cursor:pointer;transition:opacity .4s}
  #intro.open #skip{opacity:0;pointer-events:none}

  /* ───────── 청첩장 본문 ───────── */
  main{max-width:460px;margin:0 auto;background:var(--ivory);position:relative}
  section{padding:72px 28px;text-align:center}
  section + section{border-top:1px solid var(--rule)}
  .eyebrow{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:15px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase;margin-bottom:22px}
  h2{font-family:"Gowun Batang",serif;font-weight:700;font-size:20px;letter-spacing:.04em;margin-bottom:28px}
  .serif{font-family:"Gowun Batang",serif}

  .reveal{opacity:0;transform:translateY(18px);transition:opacity .9s ease, transform .9s ease}
  .reveal.in{opacity:1;transform:none}

  /* 커버 */
  #cover{padding:88px 28px 64px;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;
    background:linear-gradient(var(--ivory),var(--paper))}
  .cover-court{width:168px;height:236px;margin:6px auto 34px;position:relative}
  .cover-court svg{width:100%;height:100%}
  .cover-names{font-family:"Gowun Batang",serif;font-size:27px;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;gap:14px;justify-content:center}
  .cover-names .amp{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:26px;color:var(--accent)}
  .cover-date{margin-top:22px;font-family:"Cormorant Garamond",serif;font-size:19px;letter-spacing:.14em}
  .cover-venue{margin-top:6px;font-size:14px;color:var(--ink-soft);letter-spacing:.02em}
  .scroll-hint{margin-top:46px;font-size:11px;letter-spacing:.24em;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:8px}
  .scroll-hint i{width:1px;height:28px;background:linear-gradient(var(--ink-soft),transparent);animation:hint 1.8s ease-in-out infinite}
  @keyframes hint{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

  /* 인사말 */
  .greeting{font-family:"Gowun Batang",serif;font-size:15.5px;line-height:2.1;white-space:pre-line;color:var(--ink)}
  .parents{margin-top:40px;display:grid;gap:10px;font-size:15px}
  .parents b{font-weight:700;font-family:"Gowun Batang",serif;font-size:16.5px;letter-spacing:.05em}
  .parents span{color:var(--ink-soft);font-size:13px;margin:0 4px}

  /* 갤러리 */
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .gallery figure{aspect-ratio:3/4;border-radius:6px;overflow:hidden;background:var(--paper);display:grid;place-items:center;
    color:var(--ink-soft);font-size:12px;cursor:pointer;position:relative}
  .gallery figure.wide{grid-column:span 2;aspect-ratio:auto}
  .gallery img{width:100%;height:100%;object-fit:cover;display:block}
  .gallery .ph{display:flex;flex-direction:column;align-items:center;gap:6px}
  .gallery .ph svg{width:22px;height:22px;opacity:.5}
  #lightbox{position:fixed;inset:0;background:rgba(20,24,21,.94);z-index:60;display:none;align-items:center;justify-content:center}
  #lightbox.on{display:flex}
  #lightbox img{max-width:92vw;max-height:84vh;border-radius:4px}
  #lightbox button{position:absolute;top:16px;right:16px;background:none;border:0;color:#fff;font-size:28px;cursor:pointer;width:44px;height:44px}

  /* 일시 */
  .when-big{font-family:"Gowun Batang",serif;font-size:18px;letter-spacing:.04em}
  .when-sub{font-size:14px;color:var(--ink-soft);margin-top:4px}
  .cal{margin:30px auto 0;max-width:300px}
  .cal-head{font-family:"Cormorant Garamond",serif;font-size:20px;letter-spacing:.2em;margin-bottom:14px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;font-size:13.5px}
  .cal-grid .dow{font-size:11px;color:var(--ink-soft);letter-spacing:.06em;padding-bottom:8px;border-bottom:1px solid var(--rule);margin-bottom:6px}
  .cal-grid .sun{color:#c0645c}
  .cal-grid .d{height:36px;display:grid;place-items:center;position:relative;isolation:isolate}
  .cal-grid .d.on::before,.cal-grid .d.on::after{opacity:.55}
  .cal-grid .d.on{color:#fff;font-weight:700}
  .cal-grid .d.on::before{content:"";position:absolute;width:34px;height:34px;border-radius:50%;background:var(--ball);z-index:-1;
    box-shadow:inset 0 0 0 1px var(--ball-deep)}
  .cal-grid .d.on::after{content:"";position:absolute;width:34px;height:34px;border-radius:50%;z-index:-1;
    background:
      radial-gradient(circle at -4px 50%, transparent 13px, rgba(255,255,255,.95) 13.5px, rgba(255,255,255,.95) 15px, transparent 15.5px),
      radial-gradient(circle at 38px 50%, transparent 13px, rgba(255,255,255,.95) 13.5px, rgba(255,255,255,.95) 15px, transparent 15.5px)}
  .cal-grid .d.on{color:var(--ink);font-size:15px}
  .dday{margin-top:28px;font-size:14px;color:var(--ink-soft)}
  .dday b{color:var(--accent);font-weight:700;font-size:16px}
  .countdown{display:flex;justify-content:center;gap:10px;margin-top:18px}
  .countdown div{min-width:58px;padding:10px 0;border-radius:10px;background:var(--paper)}
  .countdown b{display:block;font-family:"Cormorant Garamond",serif;font-size:24px;line-height:1.1;font-weight:500}
  .countdown small{font-size:10.5px;letter-spacing:.12em;color:var(--ink-soft)}

  /* 오시는 길 */
  .venue-name{font-family:"Gowun Batang",serif;font-size:18px;font-weight:700}
  .venue-addr{font-size:14px;color:var(--ink-soft);margin-top:6px}
  .map{position:relative;height:280px;margin:26px -28px 0;background:var(--paper);overflow:hidden;
    border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .map-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    color:var(--ink-soft);font-size:13px;text-decoration:none;
    background:
      linear-gradient(90deg, transparent 49.6%, rgba(60,109,78,.18) 49.6%, rgba(60,109,78,.18) 50.4%, transparent 50.4%),
      linear-gradient(0deg, transparent 49.4%, rgba(60,109,78,.18) 49.4%, rgba(60,109,78,.18) 50.6%, transparent 50.6%),
      var(--paper)}
  .map-ph b{font-family:"Gowun Batang",serif;color:var(--ink);font-size:15px}
  .pin{position:relative;width:0;height:0}
  .pin .bubble{position:absolute;left:0;bottom:12px;transform:translateX(-50%);white-space:nowrap;
    background:var(--accent);color:#fff;font:700 13px "Noto Sans KR",sans-serif;padding:7px 12px;border-radius:999px;
    box-shadow:0 4px 12px rgba(0,0,0,.2)}
  .pin .bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:var(--accent);
    transform:translateX(-50%) rotate(45deg);border-radius:1px}
  .pin .dot{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--ball);
    border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  /* 실제 지도 위 마커 (크기 고정: 140×64, 점 중심이 좌표) */
  .mpin{position:relative;width:140px;height:64px;pointer-events:none}
  .mpin .bubble{position:absolute;left:50%;top:0;transform:translateX(-50%);white-space:nowrap;
    background:var(--accent);color:#fff;font:700 13px/1 "Noto Sans KR",sans-serif;padding:9px 13px;border-radius:999px;
    box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .mpin .bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:var(--accent);
    transform:translateX(-50%) rotate(45deg)}
  .mpin .dot{position:absolute;left:63px;top:50px;width:14px;height:14px;border-radius:50%;background:var(--ball);
    border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .map-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--rule);
    background:#fff;color:var(--ink);font:500 13px "Noto Sans KR",sans-serif;text-decoration:none;cursor:pointer}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .transit{text-align:left;margin-top:30px;display:grid;gap:18px}
  .transit h3{font-size:13.5px;font-weight:700;color:var(--accent);margin-bottom:4px;letter-spacing:.04em}
  .transit p{font-size:13.5px;color:var(--ink);white-space:pre-line}

  /* 마음 전하실 곳 */
  .acc{border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:#fff;text-align:left}
  .acc + .acc{margin-top:10px}
  .acc > button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:none;border:0;
    font:500 14.5px "Noto Sans KR",sans-serif;color:var(--ink);cursor:pointer}
  .acc > button i{transition:transform .3s;font-style:normal;color:var(--ink-soft)}
  .acc.on > button i{transform:rotate(180deg)}
  .acc .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s}
  .acc.on .body{grid-template-rows:1fr}
  .acc .body > div{overflow:hidden}
  .acct{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-top:1px solid var(--rule);gap:10px}
  .acct small{display:block;color:var(--ink-soft);font-size:12px}
  .acct span{font-size:14px}
  .acct .btn{height:34px;font-size:12px;padding:0 12px;flex-shrink:0}

  /* 마무리 */
  #closing{padding-bottom:96px}
  .closing-line{font-family:"Gowun Batang",serif;font-size:15px;line-height:2}
  .share{display:flex;gap:8px;justify-content:center;margin-top:30px;flex-wrap:wrap}
  footer{padding:28px;text-align:center;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);border-top:1px solid var(--rule)}

  #toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;
    background:rgba(40,48,42,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;transition:all .3s;z-index:70;pointer-events:none}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1;transform:none;transition:none}
  }
</style>
</head>
<body class="locked">

<!-- ───────── 인트로 (테니스 랠리 → 네트 기준으로 열림) ───────── -->
<div id="intro" aria-hidden="true">
  <div class="half top" id="halfTop"></div>
  <div class="half bot" id="halfBot"></div>
  <div id="ballLayer">
    <div id="ballShadow"></div>
    <div id="ball">

      <svg class="heart" viewBox="0 0 24 22">

</div>

<!-- ───────── 본문 ───────── -->
<main>
  <section id="cover">
    <div class="cover-court reveal" aria-hidden="true">
      <svg viewBox="0 0 168 236">
        <rect x="8" y="8" width="152" height="220" rx="3" fill="none" stroke="#3c6d4e" stroke-width="1.4"/>

  <section id="greeting">

  <section id="gallery-sec">

  <section id="when">

      <div class="cal-head" id="calHead"></div>

  <section id="location">

      <a class="btn" id="naverMap" target="_blank" rel="noopener">네이버 지도</a>
      <a class="btn" id="kakaoMap" target="_blank" rel="noopener">카카오맵</a>

  <section id="gift">
    <p class="eyebrow reveal">With Heart</p>

  <section id="closing">

<div id="lightbox"><button type="button" aria-label="닫기">×</button><img alt=""></div>
<div id="toast"></div>

<script>
/* ════════════════════════════════════════════════════════════
   ✏️ 여기만 수정하면 내용이 바뀌어요
   ════════════════════════════════════════════════════════════ */
const CONFIG = {
  groomName: "정재환",
  brideName: "김예솔",
  groomParents: { father: "정종철", mother: "나선연", relation: "의 아들" },
  brideParents: { father: "김경진", mother: "김영민", relation: "의 딸" },

  // 예식 일시 (24시간 표기)
  date: "2027-04-03T13:30:00",

  venue: "호텔PJ",
  hall: "1층 뮤즈홀",
  address: "서울특별시 중구 마른내로 71",
  tel: "02-2280-7070",

  // 지도 — 호텔PJ 좌표

/* ───────── 인트로 애니메이션 ───────── */
const intro = $("#intro"), halfTop = $("#halfTop"), halfBot = $("#halfBot");
const ball = $("#ball"), shadow = $("#ballShadow"), callout = $("#callout");
let L = {};            // 레이아웃 값
let players = {};
let introDone = false, runId = 0;

function buildIntro(){
  halfTop.innerHTML = courtSVG();
  halfBot.innerHTML = courtSVG();
  const b = document.createElement("div"); b.className = "player bride"; b.innerHTML = BRIDE_SVG;
  const g = document.createElement("div"); g.className = "player groom"; g.innerHTML = GROOM_SVG;
  halfTop.appendChild(b); halfBot.appendChild(g);
  players.bride = { el: b, u: .5, v: -.015, half: "top", reach: .085 };
  players.groom = { el: g, u: .5, v: 1.03,  half: "bot", reach: .085 };
  layout();
}

function layout(){
  const vw = innerWidth, vh = innerHeight;
  const ratio = COURT_H / COURT_W;
  let cw = Math.min(vw * .74, vh * .80 / ratio);
  const ch = cw * ratio;
  L = { vw, vh, cw, ch, cx: (vw - cw)/2, ct: vh/2 - ch/2, net: vh/2 };
  L.ph = cw * .34;                       // 캐릭터 높이
  L.pw = L.ph * 100/140;
  L.ball = Math.max(9, cw * .045);
  for (const [i, half] of [[0, halfTop],[1, halfBot]]){
    const svg = half.querySelector(".court");
    Object.assign(svg.style, { left: L.cx+"px", width: cw+"px", height: ch+"px", top: (L.ct - (i ? vh/2 : 0))+"px" });
  }
  Object.assign(ball.style, { width: L.ball+"px", height: L.ball+"px" });
  Object.assign(shadow.style, { width: L.ball*1.1+"px", height: L.ball*.5+"px" });
  callout.style.top = (L.net - L.ch * .1) + "px";
  callout.style.fontSize = Math.max(22, L.cw * .1) + "px";
  for (const p of Object.values(players)) placePlayer(p);
}

const X = u => L.cx + u * L.cw;
const Y = v => L.ct + v * L.ch;

function placePlayer(p){
  const offY = p.half === "bot" ? L.vh/2 : 0;
  Object.assign(p.el.style, { width: L.pw+"px", height: L.ph+"px" });
  p.el.style.transform = `translate(${X(p.u) - L.pw/2}px, ${Y(p.v) - offY - L.ph}px)`;
}
// 라켓 면(타점) 위치
const contact = p => ({ u: p.u + p.reach, v: p.v + (p.half === "top" ? .015 : -.11) });

function setBall(gu, gv, h, op = 1){
  const gx = X(gu), gy = Y(gv);
  shadow.style.transform = `translate(${gx - L.ball*.55}px, ${gy - L.ball*.25}px)`;
  shadow.style.opacity = op * Math.max(.25, 1 - h / (L.ch * .25));
  const s = 1 + h / (L.ch * .5);
  ball.style.transform = `translate(${gx - L.ball/2}px, ${gy - L.ball/2 - h}px) scale(${s})`;
}

function swing(p){
  p.el.classList.remove("swing"); void p.el.offsetWidth; p.el.classList.add("swing");
}

const ease = t => t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
const lerp = (a,b,t) => a + (b-a)*t;

function tween(dur, fn, id){
  return new Promise(res => {
    const t0 = performance.now();
    const step = now => {
      if (id !== runId) return res(false);
      const t = Math.min(1, (now - t0) / dur);
      fn(t);
      t < 1 ? requestAnimationFrame(step) : res(true);
    };
    requestAnimationFrame(step);
  });
}
const wait = (ms, id) => new Promise(r => setTimeout(() => r(id === runId), ms));

async function shot(hitter, receiver, id, dur = 1050){
  const s = contact(hitter);
  const toTop = receiver.half === "top";
  // 리시버가 받을 위치(코트 안쪽에서 랜덤)
  const targetU = lerp(.24, .62, Math.random());
  const ru0 = receiver.u;
  const endV = contact({ ...receiver, u: targetU }).v;
  const end = { u: targetU + receiver.reach, v: endV };
  const bounce = { u: lerp(s.u, end.u, .78), v: toTop ? lerp(.2, .3, Math.random()) : lerp(.7, .8, Math.random()) };
  const h1 = L.ch * .13, h2 = L.ch * .055;
  const split = .7;
  swing(hitter);
  return tween(dur, t => {
    // 받는 사람이 공 쪽으로 이동
    const mt = ease(Math.min(1, t / .85));
    receiver.u = lerp(ru0, targetU, mt);
    placePlayer(receiver);
    // 치고 난 사람은 가운데로 복귀
    hitter.u = lerp(hitter.u, .45, .02); placePlayer(hitter);
    if (t < split){
      const k = t / split;
      setBall(lerp(s.u, bounce.u, k), lerp(s.v, bounce.v, k), Math.sin(Math.PI * k) * h1);
    } else {
      const k = (t - split) / (1 - split);
      setBall(lerp(bounce.u, end.u, k), lerp(bounce.v, end.v, k), Math.sin(Math.PI * k) * h2);
    }
  }, id);
}

async function finale(hitter, id){
  // 마지막 로브: 공이 네트 위 한가운데에서 멈추고 하트로 변신
  const s = contact(hitter);
  const H = L.ch * .16;
  const gEnd = { u: .5, v: .5 + H / L.ch };          // 그림자 위치 (공은 정확히 화면 중앙에 멈춤)
  swing(hitter);
  await tween(1300, t => {
    const k = 1 - Math.pow(1 - t, 3);
    const h = Math.sin(Math.PI/2 * k) * H;
    setBall(lerp(s.u, gEnd.u, k), lerp(s.v, gEnd.v, k), h, 1 - k*.8);
    for (const p of Object.values(players)){ p.u = lerp(p.u, .38, .04); placePlayer(p); }
  }, id);
  if (id !== runId) return;
  ball.classList.add("is-heart");
  callout.textContent = "Love All";
  callout.classList.add("show");
  if (!await wait(1500, id)) return;
  openIntro();
}

function openIntro(){
  if (introDone) return;
  introDone = true;
  runId++;
  intro.classList.add("open");
  document.body.classList.remove("locked");
  setTimeout(() => { intro.style.display = "none"; }, 1700);
  requestAnimationFrame(() => document.querySelectorAll("#cover .reveal").forEach((el,i) => setTimeout(() => el.classList.add("in"), 500 + i*140)));
}

async function runIntro(){
  const id = ++runId;
  introDone = false;
  intro.style.display = ""; intro.classList.remove("open");
  ball.classList.remove("is-heart"); callout.classList.remove("show");
  document.body.classList.add("locked"); scrollTo(0,0);
  players.bride.u = .5; players.groom.u = .5;
  layout();
  setBall(contact(players.groom).u, contact(players.groom).v, L.ch*.04);

  callout.textContent = "Serve!"; callout.classList.add("show");
  if (!await wait(900, id)) return;
  callout.classList.remove("show");

  // 서브 토스
  const c = contact(players.groom);
  await tween(450, t => setBall(c.u, c.v, L.ch*.04 + Math.sin(Math.PI*t)*L.ch*.07), id);

  let hitter = players.groom, recv = players.bride;
  for (let i = 0; i < CONFIG.rallyShots; i++){
    if (!await shot(hitter, recv, id, 1000 - i*25)) return;
    [hitter, recv] = [recv, hitter];
  }
  // 마지막은 신부가 치도록 보정
  if (hitter !== players.bride){
    if (!await shot(hitter, recv, id, 900)) return;
    hitter = players.bride;
  }
  await finale(hitter, id);
}

      $("#lightbox img").src = f.querySelector("img").src; $("#lightbox").classList.add("on");
    }));
  } else {
    g.innerHTML = Array.from({length: 6}, (_,i) => `<figure><div class="ph">${imgIcon}사진 ${i+1}</div></figure>`).join("");
  }
  $("#lightbox").addEventListener("click", () => $("#lightbox").classList.remove("on"));

  $("#closingText").textContent = CONFIG.closing;
}

/* ───────── 지도 ───────── */
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
function naverWebUrl(){
  if (CONFIG.naverPlaceUrl) return CONFIG.naverPlaceUrl;
  // 좌표 + 이름으로 도착지를 지정 → 핀 하나만 표시
  return `https://map.naver.com/index.nhn?elng=${CONFIG.lng}&elat=${CONFIG.lat}&etext=${encodeURIComponent(CONFIG.venue)}&menu=route&pathType=1`;
}
function openNaver(e){
  e && e.preventDefault();
  if (isMobile && !CONFIG.naverPlaceUrl){
    // 네이버 지도 앱이 있으면 앱에서 핀 하나로 열고, 없으면 웹으로
    const app = `nmap://place?lat=${CONFIG.lat}&lng=${CONFIG.lng}&name=${encodeURIComponent(CONFIG.venue)}&appname=${encodeURIComponent(location.hostname || "wedding.invitation")}`;
    const t = setTimeout(() => { if (!document.hidden) location.href = naverWebUrl(); }, 1200);
    addEventListener("pagehide", () => clearTimeout(t), { once: true });
    location.href = app;
  } else {
    window.open(naverWebUrl(), "_blank", "noopener");
  }
}
function setupMapLinks(){
  const n = $("#naverMap");
  n.href = naverWebUrl();
  n.addEventListener("click", openNaver);
  // 카카오맵: 이름 + 좌표로 핀 하나만 표시
  $("#kakaoMap").href = `https://map.kakao.com/link/map/${encodeURIComponent(CONFIG.venue)},${CONFIG.lat},${CONFIG.lng}`;
}
function mapPlaceholder(msg){
  const box = $("#map");
  box.innerHTML = `<a class="map-ph" href="${naverWebUrl()}"><span class="pin" style="margin:24px 0 16px"><span class="bubble">${CONFIG.venue}</span><span class="dot"></span></span><b>${CONFIG.venue} ${CONFIG.hall}</b><span>${msg}</span></a>`;
  box.querySelector("a").addEventListener("click", openNaver);
}
function initMap(){
  if (!CONFIG.naverMapKey){ mapPlaceholder("터치하면 네이버 지도로 열려요"); return; }
  window.navermap_authFailure = () => mapPlaceholder("지도를 불러오지 못했어요 · 터치하면 네이버 지도로 열려요");
  const fail = () => mapPlaceholder("지도를 불러오지 못했어요 · 터치하면 네이버 지도로 열려요");
  let drawn = false;
  const draw = () => {
    if (drawn) return;
    const naver = window.naver;
    if (!naver || !naver.maps || !naver.maps.Map) return false;
    drawn = true;
    const pos = new naver.maps.LatLng(CONFIG.lat, CONFIG.lng);
    const map = new naver.maps.Map("map", {
      center: pos, zoom: 17,
      scrollWheel: false, draggable: !isMobile, pinchZoom: true, disableDoubleClickZoom: false,
      zoomControl: true, zoomControlOptions: { position: naver.maps.Position.TOP_RIGHT, style: naver.maps.ZoomControlStyle.SMALL },
      logoControlOptions: { position: naver.maps.Position.BOTTOM_LEFT },
    });
    new naver.maps.Marker({
      position: pos, map,
      icon: { content: `<div class="mpin"><span class="bubble">${CONFIG.venue}</span><span class="dot"></span></div>`,
              size: new naver.maps.Size(140, 64), anchor: new naver.maps.Point(70, 57) },
      zIndex: 100,
    });
    return true;
  };
  // 스크립트가 다 준비될 때까지 기다렸다가 그리기 (최대 10초)
  const waitAndDraw = () => {
    const t0 = Date.now();
    const iv = setInterval(() => {
      try { if (draw() !== false) clearInterval(iv); } catch (e) { clearInterval(iv); console.error(e); fail(); }
      if (!drawn && Date.now() - t0 > 10000){ clearInterval(iv); fail(); }
    }, 100);
  };
  const s = document.createElement("script");
  s.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(CONFIG.naverMapKey)}`;
  s.onload = waitAndDraw;
  s.onerror = fail;
  document.head.appendChild(s);
}

function tick(){
  const diff = wd - new Date();
  const dd = Math.ceil(diff / 864e5);
  $("#dday").innerHTML = diff > 0
    ? `${CONFIG.groomName} ♥ ${CONFIG.brideName}의 결혼식이 <b>${dd}일</b> 남았습니다`
    : `${CONFIG.groomName} ♥ ${CONFIG.brideName}, 함께한 지 <b>${Math.abs(dd)+1}일</b>`;
  const s = Math.max(0, Math.floor(diff/1000));
  const parts = [["DAYS", Math.floor(s/86400)], ["HOUR", Math.floor(s%86400/3600)], ["MIN", Math.floor(s%3600/60)], ["SEC", s%60]];
  $("#countdown").innerHTML = parts.map(([k,v]) => `<div><b>${v}</b><small>${k}</small></div>`).join("");
}

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 1800);
}
async function copy(text){
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast("복사되었어요");
}
document.addEventListener("click", e => { const b = e.target.closest("[data-copy]"); if (b) copy(b.dataset.copy); });
$("#copyAddr").addEventListener("click", () => copy(CONFIG.address));
$("#copyLink").addEventListener("click", () => copy(location.href));
$("#replay").addEventListener("click", runIntro);

// 스크롤 등장 효과
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .15 });
document.querySelectorAll("section:not(#cover) .reveal").forEach(el => io.observe(el));

fill();
buildIntro();
if (matchMedia("(prefers-reduced-motion: reduce)").matches) openIntro();
else runIntro();
</script>
</body>
</html>
