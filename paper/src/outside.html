<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>청첩장 바깥면 (뒷표지 | 앞표지)</title>
<!-- 크기: 펼친 면 250×175mm (접으면 125×175mm). 944×661px = 96dpi 기준, 가운데가 접는 선 -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="ko" style="width:944px;height:661px;display:flex;background:var(--paper)">

  <!-- 왼쪽: 뒷표지 -->
  <section style="width:472px;height:661px;box-sizing:border-box;padding:56px 48px 64px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:14px">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <circle class="line" cx="17" cy="17" r="15" stroke-width="1.2"/>
      <path class="line" d="M6 7 C 14 13, 14 21, 6 27" stroke-width="1.2"/>
      <path class="line" d="M28 7 C 20 13, 20 21, 28 27" stroke-width="1.2"/>
    </svg>
    <p class="en accent" style="font-style:italic;font-size:20px;letter-spacing:0.02em">Jaehwan &amp; Yesol</p>
    <p class="en muted" style="font-size:13px;letter-spacing:0.28em">2027 · 04 · 03</p>
  </section>

  <!-- 오른쪽: 앞표지 -->
  <section style="width:472px;height:661px;box-sizing:border-box;padding:60px 48px 56px;display:flex;flex-direction:column;align-items:center;justify-content:space-between">
    <p class="label">WEDDING INVITATION</p>
    <svg width="160" height="320" viewBox="0 0 160 320" role="img" aria-label="테니스 코트 라인 위의 이니셜 J와 Y">
      <rect class="line" x="10" y="10" width="140" height="300" stroke-width="1.2"/>
      <line class="line" x1="27.5" y1="10" x2="27.5" y2="310" stroke-width="1"/>
      <line class="line" x1="132.5" y1="10" x2="132.5" y2="310" stroke-width="1"/>
      <line class="line" x1="27.5" y1="79" x2="132.5" y2="79" stroke-width="1"/>
      <line class="line" x1="27.5" y1="241" x2="132.5" y2="241" stroke-width="1"/>
      <line class="line" x1="80" y1="79" x2="80" y2="241" stroke-width="1"/>
      <line class="line" x1="80" y1="10" x2="80" y2="16" stroke-width="1"/>
      <line class="line" x1="80" y1="304" x2="80" y2="310" stroke-width="1"/>
      <line class="line" x1="2" y1="160" x2="158" y2="160" stroke-width="2"/>
      <rect class="paper" x="44" y="140" width="72" height="40"/>
      <text class="fill" x="80" y="169" text-anchor="middle" style="font-family:var(--en);font-style:italic;font-size:26px">J &amp; Y</text>
    </svg>
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
      <p style="font-size:22px;letter-spacing:0.14em">정재환 <span class="muted" style="font-size:14px;padding:0 6px">그리고</span> 김예솔</p>
      <p class="en muted" style="font-size:14px;letter-spacing:0.22em">SATURDAY, APRIL 3, 2027 · 1:30 PM</p>
    </div>
  </section>

</main>
</body>
</html>
