<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>식권</title>
<!-- 크기: 90×50mm (명함 크기). 340×189px = 96dpi 기준 -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="ko" style="width:340px;height:189px;display:flex;background:var(--paper)">

  <section style="width:250px;height:189px;box-sizing:border-box;padding:20px 22px 18px;display:flex;flex-direction:column;justify-content:space-between">
    <div style="display:flex;flex-direction:column;gap:4px">
      <p class="en accent" style="font-size:12px;letter-spacing:0.36em">MEAL TICKET</p>
      <p class="accent" style="font-size:30px;font-weight:700;letter-spacing:0.5em">식권</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <p style="font-size:14px;letter-spacing:0.08em">정재환 · 김예솔 결혼식</p>
      <p class="en muted" style="font-size:12px;letter-spacing:0.16em">2027 · 04 · 03 · HOTEL PJ</p>
    </div>
  </section>

  <!-- 절취선 오른쪽 -->
  <section style="width:90px;height:189px;box-sizing:border-box;border-left:1.5px dashed var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
    <svg width="34" height="70" viewBox="0 0 34 70" aria-hidden="true">
      <rect class="line" x="2" y="2" width="30" height="66" stroke-width="1"/>
      <line class="line" x1="6" y1="2" x2="6" y2="68" stroke-width="0.8"/>
      <line class="line" x1="28" y1="2" x2="28" y2="68" stroke-width="0.8"/>
      <line class="line" x1="6" y1="18" x2="28" y2="18" stroke-width="0.8"/>
      <line class="line" x1="6" y1="52" x2="28" y2="52" stroke-width="0.8"/>
      <line class="line" x1="17" y1="18" x2="17" y2="52" stroke-width="0.8"/>
      <line class="line" x1="0" y1="35" x2="34" y2="35" stroke-width="1.4"/>
    </svg>
    <p class="en accent" style="font-style:italic;font-size:14px">J &amp; Y</p>
  </section>

</main>
</body>
</html>
